name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - run: rustup default stable
      - name: Verify tag and build
        shell: pwsh
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=/src/trucli --remap-path-prefix=$env:USERPROFILE=/build"
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: python scripts/package.py
      - name: Publish new prerelease (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/trucli-windows-x86_64.zip dist/SHA256SUMS.txt --verify-tag --prerelease --title "Trucli $env:GITHUB_REF_NAME" --notes-file dist/release-notes.md
